services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    volumes: ["./db:/app/db"]
  scheduler:
    build: .
    command: python -m src.scheduler
    env_file: [.env]
    volumes: ["./db:/app/db"]
  dashboard:
    build: .
    command: streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    volumes: ["./db:/app/db"]
